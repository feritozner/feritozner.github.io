<div class="box methodology-container" style="max-width: 100%; overflow: hidden;">
    <!-- Top bar and zoom buttons-->
    <div style="display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); padding: 8px 10px; border-bottom: 1px solid var(--border-color);">
        <h3 style="background: none; padding: 0; margin: 0; border: none; box-shadow: none; text-shadow: none;"><i class="fas fa-project-diagram"></i> WEB PENTEST METHODOLOGY</h3>
        
        <div class="zoom-controls" style="display: flex; align-items: center; gap: 8px;">
            <button class="theme-toggle-btn" onclick="zoomSvg('out')" aria-label="Zoom Out" style="padding: 4px 10px;">
                <i class="fas fa-search-minus"></i>
            </button>
            <span id="zoom-level" style="color: var(--header-text); font-size: 13px; font-weight: bold; min-width: 40px; text-align: center;">100%</span>
            <button class="theme-toggle-btn" onclick="zoomSvg('in')" aria-label="Zoom In" style="padding: 4px 10px;">
                <i class="fas fa-search-plus"></i>
            </button>
            <button class="theme-toggle-btn" onclick="zoomSvg('reset')" aria-label="Reset Zoom" style="padding: 4px 10px; margin-left: 5px;">
                <i class="fas fa-compress"></i>
            </button>
        </div>
    </div>
    
    <!-- The area where the SVG will be displayed -->
    <div class="tool-content" style="padding: 0; background-color: var(--bg-color);">
        <div id="svg-scroll-area" style="width: 100%; height: 650px; overflow: auto; position: relative;">
            
            <!-- The wrapper div for the SVG -->
            <div id="svg-zoom-wrapper" style="width: 100%; transition: width 0.3s ease; padding: 20px; display: flex; justify-content: center; align-items: flex-start;">
                
                <object id="pentest-map" data="assets/methodology.svg" type="image/svg+xml" style="width: 100%; height: auto; display: block; box-shadow: var(--box-shadow);">
                    Error loading SVG. Please try refreshing the page or check your connection.
                </object>

            </div>
        </div>
    </div>
</div>
